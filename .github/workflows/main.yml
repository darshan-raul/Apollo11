name: CI

# Stages 5–7 CI: lint + validate the Helm chart and Kustomize overlays, build
# container images, and push to GHCR on main / tag events.
#
# The Stage 5 Argo CD module handles deployment. This workflow is
# intentionally CD-light: we don't auto-deploy from CI.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR package paths must be lowercase. Keep this aligned with values-prod.yaml.
  IMAGE_PREFIX: darshan-raul/apollo11

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + validate packaging
  # ---------------------------------------------------------------------------
  lint:
    name: Helm + Kustomize validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the same Helm and kubectl versions the local lifecycle runs used.
      # The committed generated.yaml files are Helm 4 renders; Helm 3 emits
      # different whitespace, so test/generated.py --check fails under Helm 3.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m pip install PyYAML

      - name: Validate all maintained charts, overlays, scripts, and tests
        run: bash test/ci.sh

  # ---------------------------------------------------------------------------
  # 2. Build and scan container images (matrix, no push on PRs)
  # ---------------------------------------------------------------------------
  build:
    name: Build stage${{ matrix.stage }} ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        stage: [5, 6, 7]
        service:
          - identity
          - flight
          - booking
          - search
          - notification
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract VITE_* URLs for frontend build
        id: vite
        if: matrix.service == 'frontend'
        run: |
          CHART=stages/stage${{ matrix.stage }}/helm/apollo11/values.yaml
          read_url() { awk -v key="$1" '/^  viteUrls:/ { found=1; next } found && $1 == key ":" { gsub(/"/, "", $2); print $2; exit }' "$CHART"; }
          echo "vite_id=$(read_url identity)" >> "$GITHUB_OUTPUT"
          echo "vite_fl=$(read_url flight)" >> "$GITHUB_OUTPUT"
          echo "vite_bk=$(read_url booking)" >> "$GITHUB_OUTPUT"
          echo "vite_sr=$(read_url search)" >> "$GITHUB_OUTPUT"

      - name: Build image (load into daemon)
        uses: docker/build-push-action@v6
        with:
          context: stages/stage${{ matrix.stage }}/code/${{ matrix.service }}
          file: stages/stage${{ matrix.stage }}/code/${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/stage${{ matrix.stage }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            VITE_IDENTITY_URL=${{ steps.vite.outputs.vite_id }}
            VITE_FLIGHT_URL=${{ steps.vite.outputs.vite_fl }}
            VITE_BOOKING_URL=${{ steps.vite.outputs.vite_bk }}
            VITE_SEARCH_URL=${{ steps.vite.outputs.vite_sr }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        # Pinned by commit: trivy-action tags were force-pushed with malicious
        # code in March 2026, so a tag alone is not a trustworthy reference.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Same Trivy release used for the local image-gate evidence.
          version: 'v0.75.0'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/stage${{ matrix.stage }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Save scanned image artifact for publication
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          mkdir -p /tmp/scanned-image
          docker save "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/stage${{ matrix.stage }}/${{ matrix.service }}:sha-${{ github.sha }}" -o /tmp/scanned-image/image.tar

      - name: Upload scanned image artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: image-stage${{ matrix.stage }}-${{ matrix.service }}
          path: /tmp/scanned-image/image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. Publish to GHCR (only on main push or tag)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish stage${{ matrix.stage }} ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        stage: [5, 6, 7]
        service:
          - identity
          - flight
          - booking
          - search
          - notification
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: image-stage${{ matrix.stage }}-${{ matrix.service }}
          path: /tmp/scanned-image

      - name: Load scanned image
        run: docker load -i /tmp/scanned-image/image.tar

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/stage${{ matrix.stage }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Publish the exact scanned image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          source_image="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/stage${{ matrix.stage }}/${{ matrix.service }}:sha-${{ github.sha }}"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag "$source_image" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
