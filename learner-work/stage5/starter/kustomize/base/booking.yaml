apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: apollo-airlines-apps
spec:
  type: ClusterIP
  selector:
    app: booking
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: apollo-airlines-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
        tier: public
      annotations:
        apollo.airlines/release-channel: stable
    spec:
      priorityClassName: apollo-airlines-app-critical
      serviceAccountName: booking
      terminationGracePeriodSeconds: 30
      containers:
        - name: booking
          image: apollo11/booking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              protocol: TCP
          env:
            - name: PORT
              value: "8082"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi
