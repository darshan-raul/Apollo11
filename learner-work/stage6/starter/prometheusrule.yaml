apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flight-observability
  namespace: CHANGE_ME
  labels:
    app.kubernetes.io/name: prometheus
    # TODO: Match Prometheus ruleSelector (app.kubernetes.io/part-of: apollo-airlines)
    app.kubernetes.io/part-of: CHANGE_ME
spec:
  groups:
    - name: apollo.flight-observability
      interval: 30s
      rules:
        - record: apollo:flight_error_ratio:5m
          # TODO: Compute 5xx ratio over 2xx|5xx requests for service="flight" (suppress empty denominators)
          expr: CHANGE_ME
        - alert: ApolloFlightErrorRateHigh
          expr: apollo:flight_error_ratio:5m > 9999
          for: 2m
          labels:
            severity: critical
            service: flight
          annotations:
            summary: Flight 5xx error ratio exceeds 5 percent
        - alert: ApolloFlightLatencyP95High
          # TODO: Use histogram_quantile(0.95, ...) on http_request_duration_ms_bucket{service="flight"} > 250
          expr: CHANGE_ME > 250
          for: 2m
          labels:
            severity: warning
            service: flight
          annotations:
            summary: Flight p95 latency exceeds 250 milliseconds
