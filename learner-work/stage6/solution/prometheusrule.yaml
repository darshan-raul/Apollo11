apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flight-observability
  namespace: apollo-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: apollo-airlines
spec:
  groups:
    - name: apollo.flight-observability
      interval: 30s
      rules:
        - record: apollo:flight_error_ratio:5m
          expr: |
            (sum(rate(http_requests_total{service="flight",status=~"5.."}[5m])) or vector(0))
            / sum(rate(http_requests_total{service="flight",status=~"2..|5.."}[5m]))
            and sum(rate(http_requests_total{service="flight",status=~"2..|5.."}[5m])) > 0
        - alert: ApolloFlightErrorRateHigh
          expr: apollo:flight_error_ratio:5m > 0.05
          for: 2m
          labels:
            severity: critical
            service: flight
          annotations:
            summary: Flight 5xx error ratio exceeds 5 percent
        - alert: ApolloFlightLatencyP95High
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_bucket{service="flight"}[5m]))) > 250
          for: 2m
          labels:
            severity: warning
            service: flight
          annotations:
            summary: Flight p95 latency exceeds 250 milliseconds
