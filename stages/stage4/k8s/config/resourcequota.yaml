apiVersion: v1
kind: ResourceQuota
metadata:
  name: apollo-airlines-quota
  namespace: apollo-airlines-apps
spec:
  hard:
    pods: "30"
    requests.cpu: "4"
    limits.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apollo-ui-quota
  namespace: apollo-airlines-ui
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    limits.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 1Gi
