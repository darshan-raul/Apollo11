{{- if .Values.observability.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: apollo
  namespace: {{ .Values.observability.namespace }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: apollo-airlines
spec:
  image: {{ .Values.observability.prometheus.image | quote }}
  replicas: 1
  serviceAccountName: observability-stack
  serviceMonitorNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Values.observability.namespace }}
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: apollo-airlines
  ruleNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Values.observability.namespace }}
  ruleSelector:
    matchLabels:
      app.kubernetes.io/part-of: apollo-airlines
  alerting:
    alertmanagers:
      - namespace: {{ .Values.observability.namespace }}
        name: alertmanager
        port: http
  probeSelector:
    matchLabels:
      app.kubernetes.io/part-of: apollo-airlines
  probeNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Values.observability.namespace }}
  retention: {{ .Values.observability.prometheus.retention | quote }}
  resources:
    {{- toYaml .Values.observability.prometheus.resources | nindent 4 }}
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.observability.prometheus.storage }}
  securityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.observability.namespace }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: apollo-airlines
spec:
  type: ClusterIP
  selector:
    prometheus: apollo
  ports:
    - name: http
      port: 9090
      targetPort: web
      protocol: TCP

{{- end }}
