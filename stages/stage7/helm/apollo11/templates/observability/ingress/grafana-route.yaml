{{- if and .Values.observability.enabled .Values.gateway.enabled }}
# Cross-namespace HTTPRoute: Grafana in apollo-observability, served via
# the Envoy Gateway. The Gateway listener permits routes from all namespaces,
# and the backend Service is local to this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: {{ .Values.observability.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: apollo-airlines
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.observability.grafana.gatewayNamespace | default .Values.namespaces.apps }}
  hostnames:
    - {{ printf "grafana.%s" .Values.gateway.hostSuffix | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 3000

{{- end }}
