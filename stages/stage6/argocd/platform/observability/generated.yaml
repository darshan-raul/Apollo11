apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: apollo-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: apollo-airlines
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n\
    \    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n  \
    \  isDefault: true\n    editable: true\n    jsonData:\n      timeInterval: 30s\n\
    \      manageAlerts: true\n  - name: Loki\n    uid: loki\n    type: loki\n   \
    \ access: proxy\n    url: http://loki:3100\n    editable: true\n    jsonData:\n\
    \      maxLines: 1000\n      derivedFields:\n        - name: TraceID\n       \
    \   matcherRegex: '\"trace_id\"\\s*:\\s*\"([0-9a-f]{32})\"'\n          datasourceUid:\
    \ tempo\n          url: '$${__value.raw}'\n          urlDisplayLabel: View trace\n\
    \  - name: Tempo\n    uid: tempo\n    type: tempo\n    access: proxy\n    url:\
    \ http://tempo:3100\n    editable: true\n    jsonData:\n      tracesToLogsV2:\n\
    \        datasourceUid: loki\n        spanStartTimeShift: '-2m'\n        spanEndTimeShift:\
    \ '2m'\n        customQuery: true\n        query: '{service=~\".+\"} | json |\
    \ trace_id=\"$${__span.traceId}\"'\n      serviceMap:\n        datasourceUid:\
    \ prometheus\n      nodeGraph:\n        enabled: true\n      search:\n       \
    \ hide: false\n"
