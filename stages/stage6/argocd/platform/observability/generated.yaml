    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: apollo-airlines
data:
  alertmanager.yml: "route:\n  receiver: lab\n  group_by: [alertname, namespace]\n\
    \  group_wait: 5s\n  group_interval: 10s\n  repeat_interval: 1h\nreceivers:\n\
    \  - name: lab\n    webhook_configs:\n      - url: http://alert-receiver:8080/\n\
    \        send_resolved: true\n"
