apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver-code
  namespace: apollo-observability
  labels:
    app.kubernetes.io/name: alert-receiver
    app.kubernetes.io/part-of: apollo-airlines
data:
  receiver.py: "from http.server import BaseHTTPRequestHandler, HTTPServer\nimport\
    \ json\nevents = []\nclass Receiver(BaseHTTPRequestHandler):\n    def do_GET(self):\n\
    \        self.send_response(200)\n        self.send_header('Content-Type', 'application/json')\n\
    \        self.end_headers()\n        self.wfile.write(json.dumps(events).encode())\n\
    \    def do_POST(self):\n        event = json.loads(self.rfile.read(int(self.headers['Content-Length'])))\n\
    \        events.append(event)\n        del events[:-100]\n        print(json.dumps(event),\
    \ flush=True)\n        self.send_response(200)\n        self.end_headers()\nHTTPServer(('0.0.0.0',\
    \ 8080), Receiver).serve_forever()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: apollo-observability
  labels:
    app.kubernetes.io/name: blackbox
    app.kubernetes.io/part-of: apollo-airlines
data:
  blackbox.yml: "modules:\n  http_2xx:\n    prober: http\n    timeout: 5s\n    http:\n\
    \      preferred_ip_protocol: ip4\n  https_apollo:\n    prober: http\n    timeout:\
    \ 5s\n    http:\n      preferred_ip_protocol: ip4\n      valid_status_codes: [200]\n\
    \      fail_if_not_ssl: true\n      tls_config:\n        ca_file: /trust/ca.crt\n\
    \        server_name: frontend.apollo.local\n      headers:\n        Host: frontend.apollo.local\n"
