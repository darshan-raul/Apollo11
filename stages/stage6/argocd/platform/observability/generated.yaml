apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: apollo-observability
data:
  config.alloy: "discovery.kubernetes \"pods\" {\n  role = \"pod\"\n  selectors {\n\
    \    role  = \"pod\"\n    field = \"spec.nodeName=\" + sys.env(\"NODE_NAME\")\n\
    \  }\n}\n\ndiscovery.relabel \"pod_logs\" {\n  targets = discovery.kubernetes.pods.targets\n\
    \  rule {\n    source_labels = [\"__meta_kubernetes_namespace\"]\n    regex =\
    \ \"apollo-airlines-(.*-)?(apps|ui)\"\n    action = \"keep\"\n  }\n  rule {\n\
    \    source_labels = [\"__meta_kubernetes_namespace\"]\n    target_label  = \"\
    namespace\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_label_app\"\
    ]\n    target_label  = \"service\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_name\"\
    ]\n    target_label  = \"pod\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_container_name\"\
    ]\n    target_label  = \"container\"\n  }\n}\n\nloki.source.kubernetes \"pods\"\
    \ {\n  targets    = discovery.relabel.pod_logs.output\n  forward_to = [loki.write.local.receiver]\n\
    }\n\nloki.write \"local\" {\n  endpoint {\n    url = \"http://loki.apollo-observability.svc.cluster.local:3100/loki/api/v1/push\"\
    \n  }\n}\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: apollo-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: apollo-airlines
data:
  loki.yaml: "auth_enabled: false\n\nserver:\n  http_listen_address: 0.0.0.0\n  http_listen_port:\
    \ 3100\n  log_level: info\n  grpc_listen_port: 9096\n\ncommon:\n  path_prefix:\
    \ /var/loki\n  storage:\n    filesystem:\n      chunks_directory: /var/loki/chunks\n\
    \      rules_directory: /var/loki/rules\n  replication_factor: 1\n  ring:\n  \
    \  kvstore:\n      store: inmemory\n\nschema_config:\n  configs:\n    - from:\
    \ 2024-01-01\n      store: tsdb\n      object_store: filesystem\n      schema:\
    \ v13\n      index:\n        prefix: index_\n        period: 24h\n\nlimits_config:\n\
    \  retention_period: 168h\n  ingestion_rate_mb: 16\n  ingestion_burst_size_mb:\
    \ 24\n  reject_old_samples: true\n  reject_old_samples_max_age: 168h\n  max_query_parallelism:\
    \ 32\n  max_streams_per_user: 0\n\nquery_range:\n  results_cache:\n    cache:\n\
    \      embedded_cache:\n        enabled: true\n        max_size_mb: 100\n\nanalytics:\n\
    \  reporting_enabled: false\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: apollo-observability
data:
  relay.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc: { endpoint: 0.0.0.0:4317\
    \ }\n      http: { endpoint: 0.0.0.0:4318 }\nprocessors:\n  memory_limiter:\n\
    \    check_interval: 1s\n    limit_percentage: 75\n    spike_limit_percentage:\
    \ 20\n  batch:\n    timeout: 2s\nexporters:\n  otlp/tempo:\n    endpoint: tempo.apollo-observability.svc.cluster.local:4317\n\
    \    tls: { insecure: true }\n  debug:\n    verbosity: basic\nextensions:\n  health_check:\
    \ { endpoint: 0.0.0.0:13133 }\nservice:\n  extensions: [health_check]\n  pipelines:\n\
    \    traces:\n      receivers: [otlp]\n      processors: [memory_limiter, batch]\n\
    \      exporters: [otlp/tempo]\n    metrics:\n      receivers: [otlp]\n      processors:\
    \ [memory_limiter, batch]\n      exporters: [debug]\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: apollo-observability
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: apollo-airlines
data:
  tempo.yaml: "server:\n  http_listen_address: 0.0.0.0\n  http_listen_port: 3100\n\
    \ndistributor:\n  receivers:\n    otlp:\n      protocols:\n        grpc:\n   \
    \       endpoint: 0.0.0.0:4317\n        http:\n          endpoint: 0.0.0.0:4318\n\
    \    jaeger:\n      protocols:\n        thrift_http:\n          endpoint: 0.0.0.0:14268\n\
    \ningester:\n  trace_idle_period: 10s\n  max_block_duration: 5m\n\ncompactor:\n\
    \  compaction:\n    block_retention: 48h\n\nstorage:\n  trace:\n    backend: local\n\
    \    wal:\n      path: /var/tempo/wal\n    local:\n      path: /var/tempo/blocks\n\
    \    pool:\n      max_workers: 100\n"
