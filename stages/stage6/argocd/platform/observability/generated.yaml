  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: apollo-airlines
spec:
  image: quay.io/prometheus/prometheus:v3.13.1
  replicas: 1
  serviceAccountName: observability-stack
  serviceMonitorNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: apollo-observability
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: apollo-airlines
  ruleNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: apollo-observability
  ruleSelector:
    matchLabels:
      app.kubernetes.io/part-of: apollo-airlines
  alerting:
    alertmanagers:
    - namespace: apollo-observability
      name: alertmanager
      port: http
  probeSelector:
    matchLabels:
      app.kubernetes.io/part-of: apollo-airlines
  probeNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: apollo-observability
  retention: 30d
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  securityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
