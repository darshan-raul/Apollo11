  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: apollo-airlines
  ruleNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: apollo-observability
  ruleSelector:
    matchLabels:
      app.kubernetes.io/part-of: apollo-airlines
  retention: "7d"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
  securityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
