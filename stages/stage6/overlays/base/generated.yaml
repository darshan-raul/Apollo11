apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: apollo-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: apollo-airlines
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: apollo-airlines
    spec:
      serviceAccountName: observability-stack
      terminationGracePeriodSeconds: 30
      containers:
        - name: grafana
          image: "grafana/grafana:10.4.2"
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: username }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: password }
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_INSTALL_PLUGINS
              # Trace to logs correlation: jump from a Tempo span to the
              # matching Loki log entries.
              value: ""
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-overview
                  items: [{ key: dashboard.json, path: overview.json }]
              - configMap:
                  name: grafana-dashboard-booking
                  items: [{ key: dashboard.json, path: booking.json }]
              - configMap:
                  name: grafana-dashboard-errors
                  items: [{ key: dashboard.json, path: errors.json }]
              - configMap:
                  name: grafana-dashboard-saturation
                  items: [{ key: dashboard.json, path: runtime.json }]
              - configMap:
                  name: grafana-dashboard-trace-viewer
                  items: [{ key: dashboard.json, path: traces.json }]
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
