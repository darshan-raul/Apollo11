# Source: apollo11/templates/gateway/httproutes.yaml
# Cross-namespace ReferenceGrant — required because HTTPRoutes in
# apollo-airlines-apps (5 of them, above) need to attach to the frontend
# Service in apollo-airlines-ui, and HTTPRoutes in apollo-airlines-ui
# (1 of them, frontend) attach to the Gateway in apollo-airlines-apps.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: apollo-gateway-grant
  namespace: apollo-airlines-ui
  labels:
    app.kubernetes.io/name: apollo11
    app.kubernetes.io/instance: apollo11
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: apollo-airlines
    hermes: managed
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: apollo-airlines-apps
  to:
    - group: ""
      kind: Service
      name: frontend

