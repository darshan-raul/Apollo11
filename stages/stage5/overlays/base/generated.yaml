# Source: apollo11/templates/gateway/gateway.yaml
# The Gateway itself. Listens on port 80 (HTTP). allowedRoutes.namespaces
# is set to "All" so HTTPRoutes in any namespace can attach — but cross-
# namespace attachment still requires a ReferenceGrant in the target
# namespace (see below).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apollo-gateway
  namespace: apollo-airlines-apps
  labels:
    app.kubernetes.io/name: apollo11
    app.kubernetes.io/instance: apollo11
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: apollo-airlines
    hermes: managed
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: apollo-tls-secret
      allowedRoutes:
        namespaces:
          from: All
