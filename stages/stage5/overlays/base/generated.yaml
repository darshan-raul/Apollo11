# Source: apollo11/templates/infra/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-db
  namespace: apollo-airlines-apps
  labels:
    app.kubernetes.io/name: apollo11
    app.kubernetes.io/instance: apollo11
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: apollo-airlines
    hermes: managed
spec:
  serviceName: identity-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: identity-db
  template:
    metadata:
      labels:
        app: identity-db
        tier: data
        app.kubernetes.io/name: apollo11
        app.kubernetes.io/instance: apollo11
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: apollo-airlines
        hermes: managed
    spec:
      serviceAccountName: identity-db
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apollo-airlines-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: identity
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "identity"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "identity"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: init-script
          configMap:
            name: identity-db-init-script
  volumeClaimTemplates:
    - metadata:
        name: pg-data
        labels:
          app.kubernetes.io/name: apollo11
          app.kubernetes.io/instance: apollo11
          app.kubernetes.io/version: "1.0.0"
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/part-of: apollo-airlines
          hermes: managed
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName is intentionally omitted — kind's default
        # local-path StorageClass is used.
        resources:
          requests:
            storage: 1Gi
