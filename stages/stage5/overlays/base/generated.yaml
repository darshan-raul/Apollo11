# pod a stable DNS name: <db>-db-0.<db>-db-headless.<ns>.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: booking-db-headless
  namespace: apollo-airlines-apps
  labels:
    app.kubernetes.io/name: apollo11
    app.kubernetes.io/instance: apollo11
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: apollo-airlines
    hermes: managed
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: booking-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
