# Full nginx.conf (installed as /etc/nginx/nginx.conf) so NGINX runs as a
# non-root user: the pid file and every temp path live under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Stage 4: probe endpoints for the kubelet.
        # All three return 200 unconditionally — readiness on the frontend is
        # a kubelet-level check, not a downstream check, since NGINX has no
        # local DB/Redis to ping. The pod's readiness state is "process is
        # alive and serving", which is exactly what these return.
        location = /healthz/startup { access_log off; default_type text/plain; return 200 "starting"; }
        location = /healthz/live    { access_log off; default_type text/plain; return 200 "alive"; }
        location = /healthz/ready   { access_log off; default_type text/plain; return 200 "ready"; }
        # Legacy aliases kept for back-compat with Stage 1-3 smoke tests.
        location = /healthz         { access_log off; default_type text/plain; return 200 "ok"; }
        location = /readyz          { access_log off; default_type text/plain; return 200 "ok"; }

        # SPA fallback — unknown paths serve index.html so client-side routing works.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
