---
# Cluster platform resources are owned once, outside the three tenant
# Applications. This keeps AppProject cluster-scoped permissions empty and
# prevents dev/staging/prod from fighting over shared objects.
apiVersion: v1
kind: Namespace
metadata:
  name: apollo-airlines-dev-apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: apollo-airlines-dev-ui
---
apiVersion: v1
kind: Namespace
metadata:
  name: apollo-airlines-staging-apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: apollo-airlines-staging-ui
---
apiVersion: v1
kind: Namespace
metadata:
  name: apollo-airlines-prod-apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: apollo-airlines-prod-ui
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: apollo-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.18.0.50-172.18.0.100
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: apollo-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - apollo-pool

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apollo-airlines-app-critical
value: 1000000
globalDefault: false
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apollo-airlines-app-low
value: -100000
globalDefault: false
