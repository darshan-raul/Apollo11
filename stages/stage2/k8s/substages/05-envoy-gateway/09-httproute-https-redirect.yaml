# Non-disruptive HTTP-to-HTTPS RequestRedirect HTTPRoute on the HTTP listener.
# Uses redirect.apollo.local so existing HTTP checks on *.apollo.local remain 200.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: apollo-airlines-apps
spec:
  parentRefs:
    - name: apollo-gateway
      sectionName: http
  hostnames: ["redirect.apollo.local"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
