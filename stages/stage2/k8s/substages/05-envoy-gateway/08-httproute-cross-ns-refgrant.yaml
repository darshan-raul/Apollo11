# Cross-namespace HTTPRoute in apollo-airlines-apps targeting Service/frontend
# in apollo-airlines-ui. Exercises 01a-referencegrant.yaml (apollo-gateway-grant):
# deleting the ReferenceGrant causes ResolvedRefs=False (RefNotPermitted).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-cross-ns
  namespace: apollo-airlines-apps
spec:
  parentRefs:
    - name: apollo-gateway
  hostnames: ["cross-ns.apollo.local"]
  rules:
    - backendRefs:
        - name: frontend
          namespace: apollo-airlines-ui
          port: 3000
