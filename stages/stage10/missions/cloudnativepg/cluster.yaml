apiVersion: v1
kind: Namespace
metadata:
  name: apollo-data-lab
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: booking-lab
  namespace: apollo-data-lab
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 512Mi}
  bootstrap:
    initdb:
      database: booking
      owner: booking
      postInitApplicationSQL:
        - CREATE TABLE booking_evidence (reference text PRIMARY KEY, passenger text NOT NULL);
        - INSERT INTO booking_evidence VALUES ('APOLLO-001', 'mission-passenger');
