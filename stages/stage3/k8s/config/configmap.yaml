apiVersion: v1
kind: ConfigMap
metadata:
  name: apollo-airlines-config
  namespace: apollo-airlines-apps
data:
  NS_APPS: "apollo-airlines-apps"
  NS_UI:   "apollo-airlines-ui"
---
# Stage 3 preserves Envoy Gateway HTTP + HTTPS endpoints; Vite bakes VITE_* at build time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apollo-airlines-config
  namespace: apollo-airlines-ui
data:
  VITE_IDENTITY_URL:  "https://identity.apollo.local"
  VITE_FLIGHT_URL:    "https://flight.apollo.local"
  VITE_BOOKING_URL:   "https://booking.apollo.local"
  VITE_SEARCH_URL:    "https://search.apollo.local"
