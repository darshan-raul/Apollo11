groups:
- interval: 30s
  name: apollo.availability
  rules:
  - alert: ApolloServiceDown
    annotations:
      summary: Apollo backend metrics target is down
    expr: up{namespace="apollo-airlines-apps"} == 0
    for: 2m
    labels:
      severity: critical
      team: platform
  - alert: ApolloServiceFlapping
    annotations:
      summary: Apollo backend metrics target is flapping
    expr: changes(up{namespace="apollo-airlines-apps"}[10m]) > 6
    labels:
      severity: warning
      team: platform
- interval: 30s
  name: apollo.http
  rules:
  - alert: ApolloErrorRateHigh
    annotations:
      summary: Apollo backend 5xx rate exceeds 5 percent
    expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum
      by (service) (rate(http_requests_total[5m])), 0.001) > 0.05
    for: 5m
    labels:
      severity: critical
      team: platform
  - alert: ApolloBookingLatencyP95High
    annotations:
      summary: Booking p95 latency exceeds 500 milliseconds
    expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_bucket{service="booking"}[5m])))
      > 500
    for: 5m
    labels:
      service: booking
      severity: warning
      team: platform
- interval: 30s
  name: apollo.booking-slo
  rules:
  - expr: '(sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"5.."}[5m]))
      or vector(0))

      / sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"2..|5.."}[5m]))

      and sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"2..|5.."}[5m]))
      > 0

      '
    record: apollo:booking_error_ratio:5m
  - expr: '(sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"5.."}[1h]))
      or vector(0))

      / sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"2..|5.."}[1h]))

      and sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"2..|5.."}[1h]))
      > 0

      '
    record: apollo:booking_error_ratio:1h
  - expr: '(sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"5.."}[28d]))
      or vector(0))

      / sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"2..|5.."}[28d]))

      and sum(rate(http_requests_total{service="booking",method="POST",path="/api/bookings",status=~"2..|5.."}[28d]))
      > 0

      '
    record: apollo:booking_error_ratio:28d
  - expr: 1 - apollo:booking_error_ratio:28d / 0.005
    record: apollo:booking_error_budget_remaining:28d
  - alert: ApolloBookingErrorBudgetBurn
    annotations:
      summary: Booking creation consumes the 99.5 percent error budget at more than
        14.4 times the allowed rate
    expr: apollo:booking_error_ratio:5m > (14.4 * 0.005) and apollo:booking_error_ratio:1h
      > (14.4 * 0.005)
    for: 2m
    labels:
      service: booking
      severity: critical

